version: 2

sources:
  - name: csv
    database: estudodb  
    schema: transactional  
    tables:
      - name: accounts
        tags: ['painel_contas','hourly']
      - name: customers
        tags: ['painel_contas','hourly']

exposures:
  - name: painel-de-contas
    tags: ['painel_contas','daily']
    description: "{{ doc('descricao') }}"
    type: dashboard
    url: https://app.powerbi.com/view?r=eyJrIjoiYzhlZTk5MTEtOGU2OS00Mzk4LWI2OWItNDhiMDUwMjU4MWEwIiwidCI6IjFiY2VmYjJiLTdkMmYtNDRkNS04ZTYxLTVlZjE3ZDI2YzM4ZiJ9
    meta: {<dictionary>}
    owner:
      name: Paulo César
      email: paulocesarmlf@gmail.com
    depends_on:
      - ref('stg_accounts')
      - source('csv', 'accounts')
    label: "Painel de contas"

models:
  - name: stg_accounts
    description: modelo da area staging de contas
    columns:
      - name: account_id
        description: chave primaria da tabela
        tests:
          - unique
          - not_null
      - name: customer_id
        description: chave estrangeira da tabela de customers
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_customer')
              field: customer_id
      - name: status
        description: informa o status do cliente
        tests:
          - accepted_values:
              values: ['active','inactive']